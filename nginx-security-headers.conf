# Shared security headers.
#
# nginx's add_header inheritance is per-context: a location that declares any
# add_header drops *all* headers inherited from the server/http block. Keeping
# the list in one include and re-including it in every location that sets its
# own header guarantees index.html and static assets receive the same CSP and
# framing protections as proxied/API responses.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
