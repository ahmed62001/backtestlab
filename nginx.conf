# Production nginx configuration for BacktestLab.
# Serves the SPA from dist/, proxies /api to the backend service,
# applies security headers, gzip, and long-cache for hashed assets.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression.
    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xhtml+xml
        application/x-javascript
        image/svg+xml
        image/x-icon;

    # Security headers.
    include /etc/nginx/security-headers.conf;

    # Long cache for hashed assets, no-cache for index.html.
    map $uri $asset_cache {
        default off;
        ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ "long";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Healthcheck for nginx itself.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            include /etc/nginx/security-headers.conf;
            add_header Content-Type text/plain;
        }

        # Exact-match health/ready at root level (proxied to backend root,
        # not under /api/v1).
        location = /api/health {
            proxy_pass http://backend:8000/health;
        }

        location = /api/ready {
            proxy_pass http://backend:8000/ready;
        }

        # WebSocket market stream: disable access logging so query strings
        # (even short-lived tickets) are never written to proxy logs.
        location = /api/v1/market/stream {
            access_log off;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }

        # API proxy to backend service (preserves /api/ prefix;
        # backend routes are mounted under /api/v1 and /health).
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static assets — long cache.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # index.html — no cache.
        location = /index.html {
            expires off;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}